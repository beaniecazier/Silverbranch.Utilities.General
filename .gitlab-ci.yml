default:
  image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - test
  - secret-detection
  - deploy

variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

deploy:
  stage: deploy
  variables:
    VERSION_SUFFIX: "-alpha"
  before_script:
    - |
      dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" \
      --name gitlab \
      --username gitlab-ci-token \
      --password $CI_JOB_TOKEN \
      --store-password-in-clear-text
  script:
    - TIMESTAMP=$(date -u +"-%Y%m%d-%H%M%S")
    - dotnet build -c Release -p:versionsuffix=$VERSION_SUFFIX -p:timestamp=$TIMESTAMP
    - PACKAGE_PATH=$(find . -type f -name "Gay.Silverbranch.pkg.Utilities.General*.nupkg"| head -n 1)
    - echo "Pushing $PACKAGE_PATH"
    - |
      dotnet nuget push "$PACKAGE_PATH" \
      --source gitlab
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  environment: production
